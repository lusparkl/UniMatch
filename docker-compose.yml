services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: unimatch
      POSTGRES_PASSWORD: unimatch_local
      POSTGRES_DB: unimatch
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unimatch"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["127.0.0.1:6381:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
  redis_data:
